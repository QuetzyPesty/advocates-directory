# Publish the directory as a static site on GitHub Pages.
#
# Built from the committed data only. data/private/ (AoR contact details, the
# personal alumni list) is gitignored, so it is absent from the runner and
# cannot reach the published page.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'db/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Daily cause list', 'AoR roll']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run export
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
